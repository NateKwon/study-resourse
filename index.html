<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Resource</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #fafaf8; color: #1a1a1a; padding: 40px 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { color: #2c5f8a; border-bottom: 2px solid #2c5f8a; padding-bottom: 12px; margin-bottom: 24px; font-size: 1.6rem; }
    .folder { margin-bottom: 8px; }
    .folder-name {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; background: #e8f0f7; border-radius: 6px;
      cursor: pointer; font-weight: 600; color: #2c5f8a;
      border: 1px solid #c5d8ec; user-select: none;
    }
    .folder-name:hover { background: #d4e6f5; }
    .folder-name .arrow { font-size: 0.75rem; transition: transform 0.2s; }
    .folder-name.open .arrow { transform: rotate(90deg); }
    .folder-children { padding-left: 24px; margin-top: 4px; display: none; }
    .folder-children.open { display: block; }
    .file {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 12px; margin: 3px 0;
      border-radius: 6px; text-decoration: none; color: #1a1a1a;
      font-size: 0.9rem; transition: background 0.15s;
    }
    .file:hover { background: #f0f4f8; }
    .file-icon { font-size: 1rem; }
  </style>
</head>
<body>
<div class="container">
  <h1>📚 Study Resource</h1>

  <div class="folder">
    <div class="folder-name open" onclick="toggle(this)">
      <span class="arrow">▶</span> 📁 선형대수 학습요약
    </div>
    <div class="folder-children open">
      <a class="file" href="mathemathics/선형대수/선대 학습요약/선형대수_정리.html" target="_blank">
        <span class="file-icon">🌐</span> 선형대수_정리.html
      </a>
    </div>
  </div>
</div>

<script>
  function toggle(el) {
    el.classList.toggle('open');
    el.nextElementSibling.classList.toggle('open');
  }
</script>
</body>
</html>
